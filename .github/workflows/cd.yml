name: CD - Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-ec2:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/app

            # Capture old HEAD before pull
            OLD_HEAD=$(git rev-parse HEAD 2>/dev/null || echo "")

            git pull origin main

            # Create .env if it doesn't exist
            if [ ! -f .env ]; then
              echo "DOMAIN=${{ vars.DOMAIN }}" > .env
              echo "POSTGRES_PASSWORD=$(openssl rand -base64 32)" >> .env
              echo "BACKEND_SECRET=$(openssl rand -base64 32)" >> .env
              echo "ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}" >> .env
              echo "ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}" >> .env
              echo "ALPACA_PAPER_TRADE=true" >> .env
              echo "CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}" >> .env
              echo "CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}" >> .env
            fi

            # Ensure 2G swap exists, is active, and survives a reboot (a plain
            # mkswap/swapon here doesn't persist - a reboot silently drops it,
            # and this box is memory-tight enough that a concurrent 5-service
            # docker compose build without swap can thrash it unresponsive).
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 2G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile
            fi
            sudo swapon /swapfile 2>/dev/null || true
            grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab

            # Prune old Docker build cache (older than 7 days)
            docker builder prune --filter until=168h --force 2>/dev/null || true

            # Get current commit SHA for tagging
            NEW_HEAD=$(git rev-parse --short HEAD)
            export TAG="$NEW_HEAD"

            # Detect changed files and rebuild only affected services
            if [ -n "$OLD_HEAD" ]; then
              CHANGED=$(git diff --name-only "$OLD_HEAD" HEAD 2>/dev/null || true)
            else
              CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
            fi

            REBUILD=()
            echo "$CHANGED" | grep -qE '^ui/|^(package\.json|bun\.lock|packages/)' && REBUILD+=("ui")
            echo "$CHANGED" | grep -qE '^api/' && REBUILD+=("api")
            echo "$CHANGED" | grep -qE '^db/|^packages/proto/' && REBUILD+=("db")
            echo "$CHANGED" | grep -qE '^ai/|^api/' && REBUILD+=("ai")
            echo "$CHANGED" | grep -qE '^realtime/' && REBUILD+=("realtime")
            echo "$CHANGED" | grep -qE '^gateway/' && REBUILD+=("gateway")

            # Full rebuild if infra/compose/Dockerfiles changed
            echo "$CHANGED" | grep -qE '^compose\.(prod\.)?yaml|Dockerfile|\.dockerignore' && \
              REBUILD=("ui" "api" "db" "ai" "realtime" "gateway")

            if [ ${#REBUILD[@]} -eq 0 ]; then
              echo "No service changes detected. Skipping build."
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) SKIP no changes" >> .deploy-log
              exit 0
            fi

            echo "Rebuilding services: ${REBUILD[*]}"

            export COMPOSE_DOCKER_CLI_BUILD=1
            export DOCKER_BUILDKIT=1

            docker compose -f compose.prod.yaml build "${REBUILD[@]}"

            for svc in "${REBUILD[@]}"; do
              docker compose -f compose.prod.yaml up -d --no-deps "$svc"
            done

            # Ensure caddy is running (reverse proxy to all services)
            docker compose -f compose.prod.yaml up -d caddy
            # Ensure gateway is running (Cloudflare Workers static export)
            docker compose -f compose.prod.yaml up -d gateway 2>/dev/null || true

            # Log deployment
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) DEPLOY $NEW_HEAD services=${REBUILD[*]}" >> .deploy-log

  deploy-cloudflare:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if CF deploy needed
        id: cf-check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # workflow_run on main: HEAD == origin/main, so origin/main...HEAD is empty.
          # Check the actual triggering commit's diff via workflow_run head_sha, fallback to HEAD~1.
          if [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            git fetch origin ${{ github.event.workflow_run.head_branch }} --depth=2 2>/dev/null || true
            CHANGED=$(git diff --name-only ${{ github.event.workflow_run.head_sha }}~1...${{ github.event.workflow_run.head_sha }} 2>/dev/null || true)
            echo "Changed (workflow_run): $CHANGED"
            if echo "$CHANGED" | grep -qE 'gateway/|workers/|ui/|package\.json|bun\.lock|packages/'; then
              echo "deploy=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          echo "Changed (HEAD~1): $CHANGED"
          if echo "$CHANGED" | grep -qE '^(gateway/|workers/|ui/|package\.json|bun\.lock|packages/)'; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            # Fallback: on main with successful CI, always deploy to avoid stuck state
            echo "deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun
        if: steps.cf-check.outputs.deploy == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Build UI for static export
        if: steps.cf-check.outputs.deploy == 'true'
        run: bun install && BUILD_TARGET=export bun run build:ui
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_ORIGIN || vars.NEXT_PUBLIC_API_URL }}

      - name: Install gateway deps
        if: steps.cf-check.outputs.deploy == 'true'
        run: cd gateway && npm ci --ignore-scripts || npm install --legacy-peer-deps
        timeout-minutes: 5

      - name: Deploy gateway Worker
        if: steps.cf-check.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gateway
          command: deploy

      - name: Install new UI worker deps
        if: steps.cf-check.outputs.deploy == 'true'
        run: cd workers/ui && npm ci --ignore-scripts || npm install
        timeout-minutes: 5

      - name: Deploy new UI Worker
        if: steps.cf-check.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/ui
          command: deploy
