syntax = "proto3";

package meridian.ai.v1;

option go_package = "github.com/idk4whatamiusing/meridian_stack/api/pb/aipb";

// Ai is a thin orchestration/status control plane over the Python trading
// brain (ai/python) - it does not touch persistence (that's Python writing
// directly to Db, see ai/python/persistence.py) and does not itself run any
// trading logic.
service Ai {
  rpc RunCycle(RunCycleRequest) returns (RunCycleReply);
  rpc GetLastCycleResult(GetLastCycleResultRequest) returns (CycleResult);
}

message RunCycleRequest {
  repeated string tickers = 1; // empty = configured watchlist
}
message RunCycleReply {
  string cycle_id = 1;
  string status = 2;
}

message GetLastCycleResultRequest {}

message CycleResult {
  string cycle_id = 1;
  string started_at = 2;
  string finished_at = 3;
  int32 tickers_evaluated = 4;
  int32 trades_proposed = 5;
  int32 trades_placed = 6;
  int32 trades_blocked = 7;
  repeated string errors = 8;
  string status = 9; // running | ok | error | idle
}
