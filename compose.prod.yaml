services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ui:
        condition: service_healthy
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
      ai:
        condition: service_started

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # public GraphQL API (Go). No auth: single-user demo.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DB_GRPC_ADDR: db:8010
      AI_GRPC_ADDR: ai:8002
      REALTIME_URL: http://realtime:8001
      BACKEND_SECRET: ${BACKEND_SECRET}
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # private Postgres gatekeeper (Rust tonic :8010 + healthz :8011)
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/app
      BACKEND_SECRET: ${BACKEND_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8011/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # events fanout (Gleam) - unchanged, domain-agnostic
  realtime:
    build: ./realtime
    restart: unless-stopped
    environment:
      BACKEND_SECRET: ${BACKEND_SECRET}
      PORT: "8001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # the trading brain: Go gRPC orchestration proxy (:8002) + Python
  # FastAPI/TradingAgents/risk-gates/Alpaca-MCP-execution service (:8003,
  # internal-only, called by the Go binary over 127.0.0.1)
  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_SECRET: ${BACKEND_SECRET}
      DB_GRPC_ADDR: db:8010
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ALPACA_PAPER_TRADE: ${ALPACA_PAPER_TRADE:-true}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID}
      CF_API_TOKEN: ${CF_API_TOKEN}
      WATCHLIST: ${WATCHLIST}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
